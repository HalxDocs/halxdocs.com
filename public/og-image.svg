<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle ogDesc" font-family="Inter, Geist, Arial, Helvetica, sans-serif">
  <title id="ogTitle">HalxDocs — Notes from the build</title>
  <desc id="ogDesc">Black-and-white social preview for halxdocs.com: a full-stack engineer building APIs, distributed systems, and developer tools in Go and TypeScript.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="700" y="0" width="500" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Eyebrow -->
  <circle cx="72" cy="82" r="5" fill="#111111"/>
  <text x="92" y="87" font-size="13" font-weight="600" letter-spacing="3.2" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HALXDOCS / PORTFOLIO</text>

  <!-- Headline -->
  <text x="70" y="212" font-size="86" font-weight="700" letter-spacing="-4.2" fill="#111111">Notes from</text>
  <text x="70" y="312" font-size="86" font-weight="700" letter-spacing="-4.2" fill="#111111">the build<tspan fill="#9A9A9A">.</tspan></text>

  <!-- Subhead -->
  <text x="72" y="374" font-size="25" font-weight="400" fill="#555555">APIs, distributed systems,</text>
  <text x="72" y="410" font-size="25" font-weight="400" fill="#555555">and developer tools.</text>

  <!-- Tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#333333">
    <rect x="72" y="462" width="78" height="38" rx="19" fill="none" stroke="#D4D4D4"/>
    <text x="111" y="487" text-anchor="middle">Go</text>

    <rect x="164" y="462" width="142" height="38" rx="19" fill="none" stroke="#D4D4D4"/>
    <text x="235" y="487" text-anchor="middle">TypeScript</text>

    <rect x="320" y="462" width="212" height="38" rx="19" fill="none" stroke="#D4D4D4"/>
    <text x="426" y="487" text-anchor="middle">Backend Systems</text>
  </g>

  <!-- Footer line -->
  <line x1="72" y1="548" x2="620" y2="548" stroke="#E4E4E4" stroke-width="1"/>
  <text x="72" y="582" font-size="17" font-weight="600" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">halxdocs.com</text>
  <text x="200" y="582" font-size="17" fill="#9A9A9A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">↗</text>

  <!-- Divider -->
  <line x1="700" y1="92" x2="700" y2="540" stroke="#E4E4E4" stroke-width="1"/>

  <!-- Terminal card -->
  <rect x="748" y="132" width="392" height="330" rx="14" fill="#FAFAFA" stroke="#D9D9D9" stroke-width="1.5"/>
  <circle cx="780" cy="164" r="5.5" fill="#CFCFCF"/>
  <circle cx="800" cy="164" r="5.5" fill="#CFCFCF"/>
  <circle cx="820" cy="164" r="5.5" fill="#CFCFCF"/>
  <line x1="748" y1="190" x2="1140" y2="190" stroke="#E6E6E6" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <text x="780" y="236" fill="#8A8A8A">$ whoami</text>
    <text x="780" y="278" font-weight="600" fill="#111111">halxdocs</text>

    <text x="780" y="340" fill="#8A8A8A">$ cat now.txt</text>
    <text x="780" y="382" fill="#111111">building what lasts.</text>

    <rect x="780" y="412" width="11" height="22" fill="#111111"/>
  </g>

  <!-- Right caption -->
  <text x="748" y="508" font-size="12" letter-spacing="2.6" fill="#8A8A8A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GITHUB / HALXDOCS</text>
  <line x1="748" y1="524" x2="968" y2="524" stroke="#CFCFCF" stroke-width="1"/>
  <text x="748" y="556" font-size="13" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">go · typescript · systems</text>

  <text x="1140" y="582" text-anchor="end" font-size="12" letter-spacing="1.5" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2026</text>
</svg>
